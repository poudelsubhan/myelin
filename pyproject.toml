[project]
name = "myelin"
version = "0.1.0"
description = "Compile successful browser behavior into checked, repairable programs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "playwright>=1.51",
    "openai>=1.68",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "websockets>=16.1.1",
    "openai-agents>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]
media = [
    "imageio-ffmpeg>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
