<!doctype html><html lang="en"><meta charset="utf-8"><title>Myelin Expenses</title>
<style>body{font:17px system-ui;background:#f4f6f2;color:#20372d;max-width:760px;margin:60px auto}main{background:white;padding:32px;border-radius:18px}label{display:block;margin:18px 0}input,select,textarea{display:block;padding:10px;width:95%;font:inherit}input[type=checkbox]{display:inline;width:auto}button{background:#205d43;color:white;padding:12px 22px;border:0;border-radius:8px;font:inherit;cursor:pointer}a{color:#205d43}#error{color:#9c2525}small{color:#607268}</style>
<h1>Myelin Expenses</h1><p>Record a purchase. Review it. Submit it.</p><main id="main"></main><p id="error" role="alert"></p>
<script>
const main=document.querySelector('#main'),error=document.querySelector('#error'),key='myelin_expense_token';let amountField='amount_cents';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body,retry=0){let r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem(key)||''),...(body?{'X-Myelin-Operation-ID':crypto.randomUUID()}:{})},body:body?JSON.stringify(body):undefined});if(r.status===429&&!body&&retry<2){await new Promise(ok=>setTimeout(ok,Math.min(1000,Math.max(0,Number(r.headers.get('Retry-After'))*1000))));return api(path,body,retry+1)}let data=await r.json();if(!r.ok)throw Error(data.detail||r.status);return data}
function form(handler){main.querySelector('form').onsubmit=async e=>{e.preventDefault();error.textContent='';try{await handler(Object.fromEntries(new FormData(e.target)))}catch(err){error.textContent=err.message}}}
async function route(){error.textContent='';try{if(!localStorage.getItem(key)){main.innerHTML='<h2>Sign in</h2><form><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><label>Tenant<input name="tenant" required></label><button>Sign in</button></form>';form(async b=>{let r=await api('/login',b);localStorage.setItem(key,r.token);location.hash='';await route()});return}
let id=location.hash.slice(1);if(id&&id!=='new'){let x=await api('/expenses/'+encodeURIComponent(id));main.innerHTML='<h2>'+esc(x.merchant)+'</h2><p>'+esc(x.amount_cents)+' cents · '+esc(x.category)+' · '+esc(x.date)+'</p><p>Receipt: '+esc(x.receipt_text)+'</p><p>Status: <strong>'+esc(x.status)+'</strong></p>'+(x.status==='draft'?'<form><label>Manager note<textarea name="manager_note"></textarea></label>'+(x.amount_cents>50000?'<label><input type="checkbox" required> Confirm expense above $500</label>':'')+(x.confirmation_token?'<label><input type="checkbox" required> Confirm submission authorization</label>':'')+'<button>Submit expense</button></form>':'')+'<p><a href="#">All expenses</a></p>';if(x.status==='draft')form(async b=>{if(x.confirmation_token)b.confirmation_token=x.confirmation_token;await api('/expenses/'+encodeURIComponent(id)+'/submit',b);await route()});return}
let data=await api('/expenses');amountField=data.amount_field;if(id==='new'){main.innerHTML='<h2>New expense</h2><form><label>Merchant<input name="merchant" required></label><label>'+(amountField==='cost_cents'?'Cost in cents':'Amount in cents')+'<input name="amount_cents" type="number" min="0" step="1" required></label><label>Category<select name="category"><option>Travel</option><option>Meals</option><option>Supplies</option><option>Software</option></select></label><label>Date<input name="date" type="date" required></label><label>Receipt text<textarea name="receipt_text" required></textarea></label><button>Create expense</button></form>';form(async b=>{b[amountField]=Number(b.amount_cents);if(amountField!=='amount_cents')delete b.amount_cents;let x=await api('/expenses',b);location.hash=x.id})}else{main.innerHTML='<h2>Your expenses</h2><p><a href="#new">New expense</a></p>'+data.expenses.map(x=>'<p><a href="#'+esc(x.id)+'">'+esc(x.merchant)+'</a> — '+esc(x.status)+'</p>').join('')}}catch(err){error.textContent=err.message}}
window.onhashchange=route;route();
</script></html>
