{% extends 'base.html' %}{% block content %}<a href="/customers">Customers</a><h1>New invoice for {{customer.name}}</h1><form method="post" action="/customers/{{customer.id}}/invoices"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="operation_id" value="{{operation_id}}">
{% macro due() %}<label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" required>{% endmacro %}
{% if reordered %}{{due()}}{% endif %}
<label for="description">Description</label><input id="description" name="description" required><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" step="1" required><label for="unit_price_cents">Unit price (cents)</label><input id="unit_price_cents" name="unit_price_cents" type="number" min="0" step="1" required><label for="invoice_total">{{'Amount due' if renamed else 'Invoice total'}} (cents)</label><input id="invoice_total" name="{{'amount_due_cents' if renamed else 'total_cents'}}" type="number" min="0" step="1" required>{% if not reordered %}{{due()}}{% endif %}<button>Create invoice</button></form>{% endblock %}
